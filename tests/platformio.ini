; Unit tests for the pure parts of ARC-Core (timecode, timeline, user bits).
; They compile those sources directly, without the hardware modules.
; Run on an ESP32-S3: cd tests && pio test
[env:esp32-s3-test]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
test_framework = unity
build_flags = -I../src
